<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- %SITE_VERIFICATION% -->
    <!-- %META_PIXEL% -->

    <!-- Favicon -->
    <!-- Small copies of public/logo.png: browsers fetch the favicon on every first visit. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#c2410c" />
    <!-- Home-screen app on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Seetha Rama" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Seetha Rama Kalyana | Hindu Matrimony Across India</title>
    <!-- Defaults for crawlers that do not run JavaScript; pages replace them at runtime. -->
    <meta data-default name="description" content="Seetha Rama Kalyana is a trusted Hindu matrimony platform. Find verified brides and grooms from your community with two-way privacy and honest pricing." />
    <meta data-default property="og:type" content="website" />
    <meta data-default property="og:site_name" content="Seetha Rama Kalyana" />
    <meta data-default property="og:title" content="Seetha Rama Kalyana | Hindu Matrimony" />
    <meta data-default property="og:description" content="Find verified Hindu brides and grooms from your community." />
    <meta data-default property="og:image" content="%SITE_URL%/assets/og-default.jpg" />
    <meta data-default property="og:url" content="%SITE_URL%/" />
    <meta data-default name="twitter:card" content="summary_large_image" />

    <!-- The home page's emblem (its LCP image); see Lander.tsx. Other pages drop this (scripts/prerender.mjs). -->
    <link rel="preload" as="image" href="/logo-512.webp" imagesrcset="/logo-384.webp 384w, /logo-512.webp 512w" imagesizes="(min-width: 1024px) 360px, (min-width: 640px) 288px, 222px" fetchpriority="high" />
  </head>

  <body>
    <div id="root"></div>
    <!-- %META_PIXEL_NOSCRIPT% -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
